<!doctype html><html><head><meta charset="utf-8"><title>Three.js — Barnix</title>
<style>body{margin:16px;background:#172238;color:#fff;font-family:sans-serif}canvas{display:block}button{padding:8px}</style></head><body>
<h2>Three.js: полёт между кубами</h2><p>Стрелки ← →: движение. Пробел: пауза. CanvasRenderer, без WebGL.</p><p id="score">Счёт: 0</p><div id="game"></div>
<script src="three.min.js"></script><script src="Projector.js"></script><script src="CanvasRenderer.js"></script>
<script>
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(65,600/320,0.1,100);
const renderer=new THREE.CanvasRenderer();renderer.setSize(600,320);renderer.setClearColor(0x172238,1);
document.getElementById('game').appendChild(renderer.domElement);camera.position.z=8;
const geometry=new THREE.BoxGeometry(1,1,1), obstacles=[];
for(let i=0;i<10;i++) {const cube=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({color:i%2?0x54caff:0xffbc4b}));cube.position.set((i%5-2)*1.7,Math.sin(i)*1.8,-i*3);scene.add(cube);obstacles.push(cube);}
const player=new THREE.Mesh(new THREE.BoxGeometry(.45,.45,.45),new THREE.MeshBasicMaterial({color:0x8aff8a}));player.position.set(0,-1.8,5);scene.add(player);
let score=0,paused=false,last=0;
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')player.position.x=Math.max(-4,player.position.x-.4);else if(e.key==='ArrowRight')player.position.x=Math.min(4,player.position.x+.4);else if(e.key===' ')paused=!paused;else return;e.preventDefault();});
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!paused){for(const cube of obstacles){cube.rotation.x+=dt*.4;cube.rotation.y+=dt*.7;cube.position.z+=dt*4;if(cube.position.z>7){cube.position.z=-24;score++;document.getElementById('score').textContent='Счёт: '+score;}}}renderer.render(scene,camera);requestAnimationFrame(frame);}
renderer.render(scene,camera);requestAnimationFrame(frame);
</script></body></html>
