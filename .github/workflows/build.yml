name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential gcc-multilib grub-pc-bin grub-efi-amd64-bin grub-common \
            xorriso mtools qemu-system-x86 e2fsprogs python3 python3-pil python3-cryptography \
            fonts-liberation openjdk-21-jdk-headless zlib1g-dev
          # The runner's preinstalled default Java is older; Nova needs JDK 21.
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      # Each step keeps its full log; on failure the tail becomes a public
      # annotation, readable on the run page without downloading logs.
      - name: Build kernel, apps and ISO (warnings are errors)
        run: make -j"$(nproc)" WERROR=-Werror barnix.iso > build.log 2>&1 || { echo "::error title=build::$(tail -40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }

      - name: Host tests
        run: make check > check.log 2>&1 || { echo "::error title=check::$(tail -40 check.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }

      - name: QEMU tests (headless)
        run: make test-shell test-linux test-pipeline test-linux-commands > qemu.log 2>&1 || { echo "::error title=qemu::$(tail -40 qemu.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
