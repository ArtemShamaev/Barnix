name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib grub-pc-bin grub-efi-amd64-bin grub-common \
            xorriso mtools qemu-system-x86 e2fsprogs python3 python3-pil \
            fonts-liberation default-jdk-headless zlib1g-dev

      - name: Build kernel, apps and ISO (warnings are errors)
        run: make -j"$(nproc)" WERROR=-Werror barnix.iso

      - name: Host tests
        run: make check

      - name: QEMU tests (headless)
        run: make test-shell test-linux test-pipeline test-linux-commands
