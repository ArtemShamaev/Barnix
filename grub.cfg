set timeout=1
set default=0
# One ISO for Legacy BIOS and UEFI (laptops without CSM): UEFI boots the
# EFI kernel, which takes the GOP framebuffer and moves it below 4 GiB.
if [ "$grub_platform" = "efi" ]; then
    insmod efi_gop
    insmod efi_uga
    set gfxpayload=auto
fi

menuentry "Barnix (ATA disk or CD/DVD live fallback)" {
    if [ "$grub_platform" = "efi" ]; then
        multiboot /boot/kernel-efi.elf
    else
        multiboot /boot/kernel.elf
    fi
    module /boot/live-ext2.img
    boot
}

menuentry "Barnix Live CD/DVD (RAM only)" {
    if [ "$grub_platform" = "efi" ]; then
        multiboot /boot/kernel-efi.elf live
    else
        multiboot /boot/kernel.elf live
    fi
    module /boot/live-ext2.img
    boot
}
